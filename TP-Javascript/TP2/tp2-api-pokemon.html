<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F3F4F6;
            color: #333;
            line-height: 1.6;
        }
        
        header {
            background-color: #FFCB05;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .title {
            color: #3B4CCA;
            font-weight: 700;
            font-size: 24px;
            text-align: center;
        }
        
        .pokemons {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .pokemon-gallery {
            display: flex;
            align-items: center;
            text-align: center;
            margin-top: 30px;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 925px; /* 5 cartes de 161px + 4 espaces de 30px = 5 cartes par ligne */
        }
        
        .pokemon-card {
            background-color: #FFFFFF;
            border: 1px solid #DDDDDD;
            box-shadow: 0px 2px 10px 0px #0000001A;
            width: 161px;
            border-radius: 5px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .pokemon-name {
            font-weight: 700;
            text-transform: capitalize;
        }
        
        .btn-charge {
            background-color: #3B4CCA;
            width: 173px;
            height: 35.5px;
            border-radius: 5px;
            color: #FFFFFF;
            font-weight: 400;
            font-size: 13px;
            text-align: center;
            margin-top: 30px;
        }
        
        .pokemon-search {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .h2-title {
            color: #333333;
            font-weight: 700;
            font-size: 24px;
            padding-top: 20px;
            margin-top: 30px;
        }
        
        .input-search {
            background-color: #FFFFFF;
            border: 1px solid #CCCCCC;
            width: 161px;
            height: 37.5px;
            border-radius: 5px;
            margin-top: 30px;
        }
        
        .btn-search {
            background-color: #3B4CCA;
            width: 109px;
            height: 35.5px;
            border-radius: 5px;
            color: #FFFFFF;
            font-weight: 400;
            font-size: 13px;
            text-align: center;
            margin-top: 30px;
        }
        
        .card-pokemon {
            background-color: #FFFFFF;
            border: 1px solid #DDDDDD;
            box-shadow: 0px 2px 10px 0px #0000001A;
            padding: 20px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: 30px;
        }
        
        footer {
            background-color: #3B4CCA;
            color: #FFFFFF;
            height: 70.5px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
        }
        
        .footer {
            color: #FFFFFF;
            font-weight: 400;
            font-size: 15px;
            line-height: 100%;
        }
    </style>
</head>
<body>
   <header>
        <h1 class="title">Pokemon Explorer</h1> 
   </header>
   <main>
    <section id="pokemons" class="pokemons">
        <div id="pokemon-gallery" class="pokemon-gallery">
            <!-- Les pokemons seront affichés ici -->
        </div>
        <button type="button" class="btn-charge" id="btn-charge">Charger des Pokemons</button>
    </section>
    <section class="pokemon-search" id="pokemon-search">
        <h2 class="h2-title" id="h2-title">Recherche de Pokémon par Nom</h2>
        <input type="text" class="input-search" id="input-search" placeholder="Rechercher un Pokémon...">
        <button type="button" class="btn-search" id="btn-search">Rechercher</button>
        <div id="card-pokemon" class="card-pokemon">
            <!-- La carte du Pokémon recherché sera affichée ici -->
        </div>
    </section>
   </main>
   <footer>
        <p class="footer">© 2024 Pokémon Explorer</p>
   </footer>
    <script>
        const buttonCharge = document.getElementById("btn-charge");
        const buttonSearch = document.getElementById("btn-search");
        const pokemonGallery = document.getElementById("pokemon-gallery");
        const inputSearch = document.getElementById("input-search");
        const cardPokemon = document.getElementById("card-pokemon");
        
        async function getPokemons() {
            const ids = [];
            for (let i = 0; i < 6; i++) {
                ids.push(Math.floor(Math.random() * 1025) + 1);
            }
        
            const pokemons = await Promise.all(
                ids.map(async (id) => {
                    const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
                    return response.json();
                })
            );
        
            pokemons.sort((a, b) => a.weight - b.weight);
        
            pokemonGallery.innerHTML = "";
        
            pokemons.forEach((pokemon) => {
                pokemonGallery.innerHTML += `
                    <div class="pokemon-card">
                        <img src="${pokemon.sprites.front_default}" alt="${pokemon.name}">
                        <p class="pokemon-name">${pokemon.name}</p>
                        <p>Type: ${pokemon.types.map((t) => t.type.name).join(", ")}</p>
                        <p>Poids: ${pokemon.weight / 10} kg</p>
                    </div>
                `;
            });
        }
        
        buttonCharge.addEventListener("click", () => {
            getPokemons();
        });
        
        
        async function searchPokemon() {
            const name = inputSearch.value.trim().toLowerCase();
        
            if (name === "") {
                return;
            }
        
            const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`);
        
            if (!response.ok) {
                cardPokemon.innerHTML = `<p>Pokémon introuvable 😢</p>`;
                return;
            }
        
            const pokemon = await response.json();
        
            cardPokemon.innerHTML = `
                <img src="${pokemon.sprites.front_default}" alt="${pokemon.name}">
                <p class="pokemon-name">${pokemon.name}</p>
                <p>Type: ${pokemon.types.map((t) => t.type.name).join(", ")}</p>
                <p>Poids: ${pokemon.weight / 10} kg</p>
            `;
        }
        
        buttonSearch.addEventListener("click", () => {
            searchPokemon();
        });
    </script>
</body>
</html>
